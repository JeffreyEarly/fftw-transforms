name: Portable MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-r2025b:
    name: Linux / MATLAB R2025b Update 2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify imported history and source-only policy
        shell: bash
        run: |
          test "$(git rev-list --count 0281a11f0b6ba32d782bb5887460e1661b6a8bcf)" -eq 35
          test "$(git rev-parse 0281a11f0b6ba32d782bb5887460e1661b6a8bcf^{tree})" = "d8f8e58de659f8c0af8400c003ca98ab9529e1d5"
          test "$(tail -n +2 tools/history/gl-fftw-commit-map.tsv | wc -l | tr -d ' ')" -eq 35
          while IFS=$'\t' read -r old_commit new_commit; do
            test "$old_commit" = "old_commit" && continue
            git cat-file -e "$new_commit^{commit}"
          done < tools/history/gl-fftw-commit-map.tsv
          forbidden="$(git ls-files | grep -E '(^|/)(build|dist|\.fftw-cache|native-fftw-cache)/|\.(mexa64|mexmaci64|mexmaca64|mexw64|o|obj|a|dylib|so|dll)$|(^|/)fftw-.*\.(tar|tar\.gz|tar\.bz2|tar\.xz|zip)$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Tracked generated or third-party artifacts:\n%s\n' "$forbidden"
            exit 1
          fi
          test ! -e tools/ci_release.m
          root_matlab="$(find . -maxdepth 1 -type f -name '*.m' -exec basename {} \; | sort)"
          expected_matlab="$(printf '%s\n' FFTWBackend.m RealToComplexTransform.m RealToRealTransform.m RealToRealTransformMexFFTW.m | sort)"
          test "$root_matlab" = "$expected_matlab"
          root_native="$(find . -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.hpp' -o -name 'fftw3.h' \) -exec basename {} \; | sort)"
          expected_native="$(printf '%s\n' fftw3.h fftw_backend_support.hpp fftw_r2c.cpp fftw_r2r.cpp | sort)"
          test "$root_native" = "$expected_native"

      - name: Check out OceanKit exporter
        uses: actions/checkout@v4
        with:
          repository: JeffreyEarly/OceanKit
          ref: main
          path: OceanKit
          fetch-depth: 0

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025bU2
          cache: true

      - name: Run portable package and exported-snapshot gates
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath("tools"); addpath("tools/benchmarks"); addpath("tools/release-gates");
            build_website_documentation(rootDir=pwd);
            sourcePackage = matlab.mpm.Package(pwd); sourceSemanticVersion = sourcePackage.Version; sourceVersion = string(sourceSemanticVersion);
            if sourceVersion == "0.1.0"; candidateVersion = "1.0.0"; bumpType = "major";
            elseif sourceSemanticVersion.Major == 1 && sourceSemanticVersion.Minor == 0; candidateVersion = sourceVersion; bumpType = "none";
            else; error("FFTWTransforms:UnexpectedCIVersion","Portable CI does not recognize source version %s.",sourceVersion); end;
            gate = runFFTWTransformsReleaseGate(oceanKitRoot=fullfile(pwd,"OceanKit"),outputDirectory=string(tempname),runId="portable-ci",sourceVersion=sourceVersion,candidateVersion=candidateVersion,bumpType=bumpType,requireCanonicalPlatform=false);
            assert(gate.status == "passed"); fprintf("OceanKit exporter commit is %s\n",gate.exporter.commit);
            results = runtests({'UnitTests/TestPackageScaffold.m','UnitTests/TestFFTWBackendPortable.m','tools/benchmarks/UnitTests/TestFFTWBenchmarkHistory.m','tools/release-gates/UnitTests/TestFFTWTransformsReleaseGate.m'});
            assertSuccess(results)

      - name: Verify artifact-only commit discipline
        shell: bash
        run: |
          artifact="$(find tools/release-gates/results -name release-gate.json -type f -print -quit)"
          test -n "$artifact"
          candidate="$(jq -r .candidateSourceCommit "$artifact")"
          artifact_commit="$(git log -1 --format=%H -- "$artifact")"
          test "$(git rev-parse "$artifact_commit^")" = "$candidate"
          unexpected="$(git diff --name-only "$candidate" "$artifact_commit" | grep -v '^tools/release-gates/results/' || true)"
          test -z "$unexpected"

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs
